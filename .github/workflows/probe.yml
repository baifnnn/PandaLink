name: probe

# 诊断用：确认这个账号的 Actions 到底能不能调到 runner。
# Ubuntu runner 是最廉价、最容易分配的，如果连它都排不上，说明是账号层面的限制，
# 跟 macOS 镜像无关。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报到
        run: |
          echo "runner ok"
          uname -a
          echo "sha=$GITHUB_SHA"
