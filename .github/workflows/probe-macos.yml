name: probe-macos

# 诊断用：探哪些 macOS 标签在这个账号下真的能分到机器。
# ubuntu-latest 已 9 秒跑完，说明 Actions 本身正常，卡的是 macOS runner。

on:
  workflow_dispatch:

jobs:
  m15:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - run: echo "macos-15 ok"; sw_vers

  m14:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - run: echo "macos-14 ok"; sw_vers

  m13:
    runs-on: macos-13
    timeout-minutes: 5
    steps:
      - run: echo "macos-13 ok"; sw_vers

  mlatest:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - run: echo "macos-latest ok"; sw_vers
